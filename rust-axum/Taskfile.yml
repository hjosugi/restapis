# https://taskfile.dev
version: "3"

vars:
  PORT: 8004
  # devShell の外から実行されたら `nix develop` 経由にする（direnv で入っていればそのまま実行）
  NIX: '{{if ne .RESTAPI_PROJECT "rust-axum"}}nix develop {{.TASKFILE_DIR}} --command {{end}}'

env:
  PORT: "{{.PORT}}"

tasks:
  default:
    cmd: task --list
    silent: true

  dev:
    desc: サーバーをホットリロードで起動
    cmd: "{{.NIX}}watchexec --restart --exts rs,toml -- cargo run --bin server"

  run:
    desc: サーバーを起動
    aliases: [main, server]
    cmd: "{{.NIX}}cargo run --bin server"

  client:
    desc: クライアントで CRUD + 検索を実行（先にサーバーを起動しておく）
    cmd: "{{.NIX}}cargo run --quiet --bin client"

  build:
    desc: バイナリをビルド（debug ビルドの server と client）
    cmd: "{{.NIX}}cargo build"

  fmt:
    desc: フォーマット (rustfmt)
    cmd: "{{.NIX}}cargo fmt"

  lint:
    desc: リント (clippy)
    cmd: "{{.NIX}}cargo clippy --all-targets -- --deny warnings"

  check:
    desc: 起動中のサーバーが API 仕様どおりか curl で検証
    cmd: "{{.NIX}}{{.TASKFILE_DIR}}/../scripts/check.sh http://127.0.0.1:{{.PORT}}"
