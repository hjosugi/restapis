[package]
name = "rust-axum"
version = "0.1.0"
edition = "2024"
publish = false

# src/bin/server.rs と src/bin/client.rs がそれぞれ `--bin server` / `--bin client` になる
[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] } # TLS は既定の rustls
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# 依存クレートのデバッグ情報は省いて target/ を小さく保つ（自分のコードはデバッガで追える）
[profile.dev.package."*"]
debug = false
